name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r backend/requirements-dev.txt
          pip install opencv-python-headless scipy
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  firmware:
    name: Firmware (ESP-IDF v5.4.4, ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware/esp-idf
      - uses: actions/upload-artifact@v4
        with:
          name: isms-node-firmware
          path: |
            firmware/esp-idf/build/factory.bin
            firmware/esp-idf/build/bootloader/bootloader.bin
            firmware/esp-idf/build/partition_table/partition-table.bin
            firmware/esp-idf/build/flasher_args.json
