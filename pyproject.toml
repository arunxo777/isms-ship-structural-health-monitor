[project]
name = "isms-ship-structural-health-monitor"
version = "1.0.0"
description = "Contactless ship hull structural health monitoring: ESP32-S3 sensor node + Raspberry Pi edge AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tools"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "anomaly", "crack_detect", "ollama_client", "server", "probe_vision"]
